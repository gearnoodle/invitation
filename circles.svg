<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 644" role="img" aria-label="Ten circles, from your inner world out to the universe, and back to your inner world" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="644" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">Ten circles, from your inner world out to the universe</text>

  <!-- 0 again: the outermost ring -->
  <circle cx="380" cy="340" r="280" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- Rings 9 to 1 -->
  <g fill="none" stroke="#8a8a8a" stroke-width="1.25">
    <circle cx="380" cy="340" r="256" stroke-dasharray="4 4"/>
    <circle cx="380" cy="340" r="232"/>
    <circle cx="380" cy="340" r="208"/>
    <circle cx="380" cy="340" r="184"/>
    <circle cx="380" cy="340" r="160"/>
    <circle cx="380" cy="340" r="136"/>
    <circle cx="380" cy="340" r="112"/>
    <circle cx="380" cy="340" r="88"/>
    <circle cx="380" cy="340" r="64"/>
  </g>

  <!-- Centre: 0 Inner world -->
  <circle cx="380" cy="340" r="40" fill="#d97757" fill-opacity="0.12" stroke="#d97757" stroke-width="2"/>
  <text x="380" y="338" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f1f1f">0</text>
  <text x="380" y="352" text-anchor="middle" font-size="10.5" fill="#1f1f1f">Inner world</text>

  <!-- Labels, with a white halo so ring lines don't cross the words -->
  <g text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="380" y="292" fill="#1f1f1f">1 Yourself</text>
    <text x="380" y="268" fill="#1f1f1f">2 People close to you</text>
    <text x="380" y="244" fill="#1f1f1f">3 Street and town</text>
    <text x="380" y="220" fill="#1f1f1f">4 Everyday systems</text>
    <text x="380" y="196" fill="#1f1f1f">5 The crowd</text>
    <text x="380" y="172" fill="#1f1f1f">6 Human civilisation</text>
    <text x="380" y="148" fill="#1f1f1f">7 The Earth itself</text>
    <text x="380" y="124" fill="#1f1f1f">8 Space within reach</text>
    <text x="380" y="100" fill="#6b6b6b">9 The universe</text>
    <text x="380" y="76" font-weight="600" fill="#1f1f1f">0 Inner world, again</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
