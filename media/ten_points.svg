<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -26 940 820" role="img" aria-label="INVITATION for new DESIGN for humanity. The ultimate aim for the new design: one day, everyone finally has enough" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="-90" y="-26" width="940" height="820" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="26" font-weight="800" fill="#1f1f1f">INVITATION for new DESIGN for humanity</text>

  <!-- Ultimate aim: wraps the whole structure -->
  <rect x="-78" y="48" width="916" height="730" rx="14" fill="#c6e7fb" stroke="#1f9de6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="380" y="74" text-anchor="middle" font-weight="700" fill="#126aa3" letter-spacing="0.5">ULTIMATE AIM FOR THE NEW DESIGN</text>
  <text x="380" y="96" text-anchor="middle" font-size="13" font-style="italic" fill="#1f1f1f">Because one day, everyone finally has enough.</text>

  <!-- 3 asks: container 390 wide, items 358 wide (80% of 448) -->
  <rect x="185" y="112" width="390" height="180" rx="10" fill="#ffffff" stroke="#d6799d" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="380" y="132" text-anchor="middle" font-weight="700" fill="#6b6b6b" letter-spacing="0.5">3 ASKS</text>
  <g fill="#f9cadb" stroke="#d6799d" stroke-width="1.25">
    <rect x="201" y="144" width="358" height="40" rx="8"/>
    <rect x="201" y="192" width="358" height="40" rx="8"/>
    <rect x="201" y="240" width="358" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1f">
    <text x="380" y="168"><tspan font-weight="600">1. Don't harm:</tspan> people, animals, the Earth</text>
    <text x="380" y="216"><tspan font-weight="600">2. Don't deceive:</tspan> trust makes rules unneeded</text>
    <text x="380" y="264"><tspan font-weight="600">3. Don't block others,</tspan> unless they harm or deceive</text>
  </g>

  <!-- 3 propositions: container 480 wide, items 448 wide (80% of 560) -->
  <rect x="140" y="304" width="480" height="192" rx="10" fill="#ffffff" stroke="#d1a32a" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="380" y="324" text-anchor="middle" font-weight="700" fill="#6b6b6b" letter-spacing="0.5">3 PROPOSITIONS</text>
  <g fill="#fbe39c" stroke="#d1a32a" stroke-width="1.25">
    <rect x="156" y="336" width="448" height="44" rx="8"/>
    <rect x="156" y="388" width="448" height="44" rx="8"/>
    <rect x="156" y="440" width="448" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1f" font-size="12.5">
    <text x="380" y="362"><tspan font-weight="600">1. No blame:</tspan> look for causes, not someone to blame</text>
    <text x="380" y="414"><tspan font-weight="600">2. No credit:</tspan> nobody owns what we made together</text>
    <text x="380" y="466"><tspan font-weight="600">3. Mistakes welcome:</tspan> even all these 10 blocks could use fixing</text>
  </g>

  <!-- The foundation: 560 wide (80% of 700) -->
  <rect x="100" y="508" width="560" height="76" rx="8" fill="#d5d7da" stroke="#8b8f94" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="380" y="532" fill="#6b6b6b">The foundation</text>
    <text x="380" y="560" font-size="17" font-weight="700" fill="#1f1f1f">Nothing is owed back</text>
  </g>

  <!-- The evolution: 700 wide -->
  <rect x="30" y="596" width="700" height="76" rx="8" fill="#a9dc8c" stroke="#5c9a3d" stroke-width="2.5"/>
  <g text-anchor="middle">
    <text x="380" y="620" fill="#2f5a1c">1. The evolution</text>
    <text x="380" y="648" font-size="17" font-weight="700" fill="#1f1f1f">Everything can be changed when there is great need</text>
  </g>

  <!-- The ground rule: 875 wide (700 / 0.8), the bottom-most layer, like dirt under grass -->
  <rect x="-57.5" y="684" width="875" height="76" rx="8" fill="#d9bf9e" stroke="#8a6236" stroke-width="2.5"/>
  <g text-anchor="middle">
    <text x="380" y="708" fill="#5c3d1e">0. The ground rule</text>
    <text x="380" y="736" font-size="17" font-weight="700" fill="#1f1f1f">Anyone can walk away</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 2. The right to fork: a big fork shoved into the green evolution layer -->
  <defs>
    <clipPath id="aboveSurface"><rect x="-90" y="-26" width="940" height="623"/></clipPath>
    <clipPath id="belowSurface"><rect x="-90" y="597" width="940" height="200"/></clipPath>
    <g id="fork" stroke="#5f6670" stroke-width="1.5" fill="#c9ced5" stroke-linejoin="round">
      <rect x="-16" y="-48" width="5" height="48" rx="2.5"/>
      <rect x="-6.5" y="-48" width="5" height="48" rx="2.5"/>
      <rect x="1.5" y="-48" width="5" height="48" rx="2.5"/>
      <rect x="11" y="-48" width="5" height="48" rx="2.5"/>
      <path d="M -16 -44 L 16 -44 L 16 -58 Q 16 -70 5 -78 L 5 -96 L -5 -96 L -5 -78 Q -16 -70 -16 -58 Z"/>
      <path d="M -5 -94 L 5 -94 L 10 -200 Q 10 -212 0 -212 Q -10 -212 -10 -200 Z"/>
    </g>
  </defs>
  <g clip-path="url(#belowSurface)" opacity="0.45"><use href="#fork" transform="translate(688 652) rotate(25) scale(1.3)"/></g>
  <g clip-path="url(#aboveSurface)"><use href="#fork" transform="translate(688 652) rotate(25) scale(1.3)"/></g>
  <text x="788" y="400" text-anchor="end" font-weight="700" fill="#1f1f1f">2. The right to fork</text>
</svg>
